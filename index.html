// Web Audio Synthesizer for 8-Bit Sound Effects
class RetroSoundEngine {
constructor() {
this.enabled = true;
this.ctx = null;
}
init() {
if (!this.ctx) {
const AudioCtx = window.AudioContext || window.webkitAudioContext;
if (AudioCtx) this.ctx = new AudioCtx();
}
if (this.ctx && this.ctx.state === 'suspended') {
this.ctx.resume();
}
}
playTone(freq, type, duration, endFreq = null, gainVal = 0.11) {
if (!this.enabled) return;
try {
this.init();
if (!this.ctx) return;
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.type = type;
osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
if (endFreq !== null) {
osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), this.ctx.currentTime + duration);
}
gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + duration);
osc.connect(gain);
gain.connect(this.ctx.destination);
osc.start();
osc.stop(this.ctx.currentTime + duration);
} catch (e) {
// Ignore audio restriction errors
}
}
jump() { this.playTone(170, 'square', 0.11, 440, 0.08); }
hitClear() { this.playTone(300, 'triangle', 0.09, 640, 0.13); }
hitSmash() { this.playTone(580, 'sawtooth', 0.15, 110, 0.16); }
hitDrop() { this.playTone(420, 'sine', 0.07, 250, 0.10); }
netTouch() { this.playTone(140, 'sawtooth', 0.12, 75, 0.11); }
pauseBeep() { this.playTone(520, 'square', 0.08, 390, 0.08); }
focusSlowMo() { this.playTone(460, 'sine', 0.18, 190, 0.09); }
pointPlayer() {
this.playTone(523.25, 'square', 0.08, null, 0.09);
setTimeout(() => this.playTone(659.25, 'square', 0.08, null, 0.09), 80);
setTimeout(() => this.playTone(783.99, 'square', 0.16, null, 0.09), 160);
}
pointAI() {
this.playTone(310, 'square', 0.10, null, 0.09);
setTimeout(() => this.playTone(230, 'square', 0.18, null, 0.09), 110);
}
}

if (code.startsWith('Digit')) return code.slice(5);

}

whiffChance: Math.min(0.50, base.whiffChance + fatigue * fatigueWhiffAdd),

});
ctx.globalAlpha = 1.0;
// 11. Banner Prompts
if (match.phase !== 'rally' && !match.paused) {
const bannerY = config.arena === 'dome' ? 166 : 152;
ctx.textAlign = 'center';
ctx.fillStyle = pal.fg;
ctx.font = '13px "Press Start 2P", monospace';
ctx.fillText(match.pointReason, W / 2, bannerY);
ctx.fillStyle = pal.muted;
ctx.font = '700 11px "JetBrains Mono", monospace';
ctx.fillText(match.subMessage, W / 2, bannerY + 20);
}
// 12. Instant Mid-Game Setting Change Toast
if (match.toastTimer > 0) {
ctx.save();
const tw = 340;
const th = 28;
const tx = (W - tw) / 2;
const ty = H - 36;
ctx.fillStyle = pal.fg;
ctx.fillRect(tx, ty, tw, th);
ctx.fillStyle = pal.bg;
ctx.font = '9px "Press Start 2P", monospace';
ctx.textAlign = 'center';
ctx.fillText(match.toastText, W / 2, ty + 19);
ctx.restore();
}
// 13. Pause Overlay
if (match.paused) {
drawPauseModal(pal);
}
ctx.restore();
}
// Single-Level UI Control Callbacks
function togglePause() {
match.paused = !match.paused;
const btn = document.getElementById('btn-pause');
if (btn) btn.classList.toggle('selected', match.paused);
if (pauseLabelEl) pauseLabelEl.textContent = match.paused ? 'RESUME (P)' : 'PAUSE (P)';
sfx.pauseBeep();
}
function setCharacter(charKey) {
config.character = charKey;
['dino', 'stick'].forEach(c => {
const btn = document.getElementById(`char-${c}`);
if (btn) btn.classList.toggle('selected', c === charKey);
});
try {
localStorage.setItem('dino_badminton_char', charKey);
} catch (e) {}
showStatusToast(charKey === 'stick' ? 'CHARACTER: STICK FIGHTER' : 'CHARACTER: PIXEL DINO');
sfx.hitClear();
}
function setArena(arenaKey) {
if (isArenaLocked()) {
showStatusToast('LOCKED IN MATCH! CLICK [RESET] TO SWITCH ARENA');
sfx.netTouch();
return;
}
config.arena = arenaKey;
['stadium', 'dome', 'desert'].forEach(a => {
const btn = document.getElementById(`env-${a}`);
if (btn) btn.classList.toggle('selected', a === arenaKey);
});
try {
localStorage.setItem('dino_badminton_arena', arenaKey);
} catch (e) {}
const names = {
stadium: 'ARENA: DINO OPEN STADIUM',
dome: 'ARENA: TOKYO CYBER DOME',
desert: 'ARENA: CLASSIC DESERT'
};
showStatusToast(names[arenaKey] || 'ARENA UPDATED');
updateArenaLockUI();
sfx.hitDrop();
}
function toggleSlowMo() {
config.slowMoEnabled = !config.slowMoEnabled;
if (!config.slowMoEnabled) match.slowMoTimer = 0;
const btn = document.getElementById('btn-slowmo');
const lbl = document.getElementById('slowmo-icon');
if (btn) btn.classList.toggle('selected', config.slowMoEnabled);
if (lbl) lbl.textContent = config.slowMoEnabled ? 'SLOW-MO:ON' : 'SLOW-MO:OFF';
showStatusToast(config.slowMoEnabled ? 'FOCUS SLOW-MO: ON' : 'FOCUS SLOW-MO: OFF');
sfx.hitDrop();
}
function setDifficulty(level) {
config.difficulty = level;
['easy', 'medium', 'hard'].forEach(d => {
const btn = document.getElementById(`diff-${d}`);
if (btn) btn.classList.toggle('selected', d === level);
});
// Immediately recalculate AI speed, stamina, target & cancel any pending whiff mid-rally
recalculateAIMidRally();
const prof = AI_PROFILES[level] || AI_PROFILES.medium;
showStatusToast(`DIFFICULTY: ${prof.label}`);
sfx.hitClear();
}
function setSmashMode(mode) {
config.smashMode = mode;
['auto', 'dedicated', 'air'].forEach(m => {
const btn = document.getElementById(`smode-${m}`);
if (btn) btn.classList.toggle('selected', m === mode);
});
sfx.hitSmash();
}
function setTargetPoints(pts) {
config.targetPoints = pts;
[11, 21].forEach(p => {
const btn = document.getElementById(`pts-${p}`);
if (btn) btn.classList.toggle('selected', p === pts);
});
resetMatch();
}
function toggleAssist() {
config.autoAssist = !config.autoAssist;
const btn = document.getElementById('btn-assist');
const lbl = document.getElementById('assist-icon');
if (btn) btn.classList.toggle('selected', config.autoAssist);
if (lbl) lbl.textContent = config.autoAssist ? 'AUTO-RUN:ON' : 'AUTO-RUN:OFF';
sfx.hitDrop();
}
function toggleSound() {
sfx.enabled = !sfx.enabled;
const icon = document.getElementById('sound-icon');
const btn = document.getElementById('btn-sound');
if (icon) icon.textContent = sfx.enabled ? 'SFX:ON' : 'SFX:OFF';
if (btn) btn.classList.toggle('selected', !sfx.enabled);
if (sfx.enabled) sfx.hitClear();
}
function toggleTheme() {
config.darkMode = !config.darkMode;
document.body.classList.toggle('dark-mode', config.darkMode);
const icon = document.getElementById('theme-icon');
const btn = document.getElementById('btn-theme');
if (icon) icon.textContent = config.darkMode ? 'DAY' : 'NIGHT';
if (btn) btn.classList.toggle('selected', config.darkMode);
}
function resetMatch() {
match.paused = false;
const pauseBtn = document.getElementById('btn-pause');
if (pauseBtn) pauseBtn.classList.remove('selected');
if (pauseLabelEl) pauseLabelEl.textContent = 'PAUSE (P)';
match.playerScore = 0;
match.aiScore = 0;
match.consecutiveAILead = 0;
match.rally = 0;
match.winner = null;
match.slowMoTimer = 0;
updateRallyUI();
updateScoreHeaderUI();
setupServe('player');
updateArenaLockUI();
showStatusToast('MATCH RESET // ARENA SELECT UNLOCKED');
sfx.jump();
}
// Auto-enable Auto-Run Assist on small mobile screens for immediate pick-up-and-play fun
if (window.innerWidth < 640) {
config.autoAssist = true;
const btn = document.getElementById('btn-assist');
const lbl = document.getElementById('assist-icon');
if (btn) btn.classList.add('selected');
if (lbl) lbl.textContent = 'AUTO-RUN:ON';
}
const TARGET_FPS = 60;
const FIXED_STEP_MS = 1000 / TARGET_FPS; // 16.6667ms per physics tick
let lastFrameTime = performance.now();
let timeAccumulator = 0;
function gameLoop(now) {
if (typeof now !== 'number') now = performance.now();
let frameDelta = now - lastFrameTime;
lastFrameTime = now;
// Clamp large delta spikes (e.g. switching browser tabs or window minimize)
if (frameDelta > 200) {
frameDelta = FIXED_STEP_MS;
}
if (!match.paused) {
timeAccumulator += frameDelta;
// Run physics updates at a strict 60Hz rate regardless of 60Hz/120Hz/144Hz/240Hz monitor or browser
let subSteps = 0;
while (timeAccumulator >= FIXED_STEP_MS && subSteps < 5) {
update();
timeAccumulator -= FIXED_STEP_MS;
subSteps++;
}
} else {
timeAccumulator = 0;
}
draw();
requestAnimationFrame(gameLoop);
}
window.onload = function () {
setCharacter(config.character);
setArena(config.arena);
updateKeybindLabels();
setupServe('player');
updateArenaLockUI();
lastFrameTime = performance.now();
requestAnimationFrame(gameLoop);
};
